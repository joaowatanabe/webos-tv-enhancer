<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Free My TV</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
    <script src="webOSTV.js"></script>
    <script src="config.example.js"></script>
    <script src="config.js"></script>
    <style>
        /* Launcher estilo Apple TV — design aprovado em 2026-10-28.
           Tela fixa 1920x1080; o deck rola por dentro (home + 3 fileiras).
           webOS 6.5 = Chromium 79: nada de cqw, aspect-ratio ou gap em flexbox. */
        :root {
            --ink: #f5f7fc;
            --ink-dim: #b2b8c8;
            --ink-faint: #767d92;
            --panel: rgba(255, 255, 255, 0.06);
            --panel-2: rgba(10, 12, 18, 0.30);
            --panel-line: rgba(255, 255, 255, 0.10);
            --panel-line-soft: rgba(255, 255, 255, 0.06);
            --focus: #ffffff;
            --focus-glow: rgba(255, 255, 255, 0.5);
            --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --ease: cubic-bezier(.2, .75, .2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }

        html, body {
            width: 1920px; height: 1080px; overflow: hidden;
            background: #000; color: var(--ink); font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        /* --- Fundo: aerial em vídeo, fallback preto OLED --- */
        .bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 0; background: #000; }
        .bg video {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover;
            opacity: 0; transition: opacity 1.6s ease;
        }
        .bg video.on { opacity: 1; }
        .bg::after {
            content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
            background:
                linear-gradient(180deg, rgba(0,0,0,.40) 0%, transparent 24%, transparent 46%, rgba(0,0,0,.82) 100%),
                radial-gradient(120% 90% at 50% 38%, transparent 52%, rgba(0,0,0,.5) 100%);
            transition: opacity 1.2s ease;
        }
        .bg .dim { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; opacity: 0; transition: opacity 1.2s ease; }
        body.night .bg .dim { opacity: .3; }

        /* --- Tela / deck rolável --- */
        .screen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 2; overflow: hidden; transition: opacity .9s ease; }
        .deck { position: relative; transition: transform .34s var(--ease); }


        .home { height: 1080px; display: flex; flex-direction: column; padding: 61px 69px 58px; }
        .top { display: flex; align-items: flex-start; justify-content: space-between; }
        .greet { font-size: 34px; font-weight: 600; letter-spacing: -0.015em; }
        .greet small { display: block; font-size: 21px; font-weight: 400; color: var(--ink-dim); margin-top: 4px; }
        .clock { text-align: right; line-height: 1.15; font-variant-numeric: tabular-nums; }
        .clock .t { display: block; font-size: 50px; font-weight: 700; letter-spacing: -0.02em; }
        .clock .d { font-size: 20px; color: var(--ink-dim); }

        .lower { margin-top: auto; display: flex; flex-direction: column; }
        .lower > * + * { margin-top: 24px; }
        .hero .cat { font-size: 22px; color: var(--ink-dim); margin-bottom: 6px; letter-spacing: .01em; }
        .hero .name { font-size: 90px; font-weight: 700; letter-spacing: -0.03em; line-height: .96; }

        /* --- Dock (só streaming) --- */
        .dock {
            display: flex; padding: 16px 27px;
            background: var(--panel); border: 1px solid var(--panel-line); border-radius: 38px;
        }
        .tile {
            position: relative; flex: 1 1 0; height: 142px; border-radius: 23px;
            display: flex; align-items: center; justify-content: center;
            transition: transform .2s var(--ease), opacity .2s ease;
        }
        .tile + .tile { margin-left: 23px; }
        .tile img { display: block; max-width: 56%; max-height: 46%; }
        .tile img.wide { max-width: 70%; max-height: 40%; }
        .tile .wd { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
        .tile .label {
            position: absolute; left: 0; right: 0; bottom: -28px; text-align: center;
            font-size: 18px; color: var(--ink-dim); opacity: 0; transition: opacity .2s ease;
        }
        .tile.on { transform: translateY(-11px) scale(1.07); z-index: 3;
            box-shadow: 0 0 0 5px var(--focus), 0 12px 28px rgba(0,0,0,.5); }
        .tile.on .label { opacity: 1; }
        body.in-dock .tile:not(.on) { opacity: .5; }

        /* --- Widgets de clima --- */
        .lower > .shelf { margin-top: 40px; }
        .shelf { display: flex; }
        .card {
            flex: 1 1 0; min-width: 0; padding: 16px 29px 20px;
            background: var(--panel-2); border: 1px solid var(--panel-line-soft); border-radius: 27px;
        }
        .card + .card { margin-left: 27px; }
        .lbl { font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 12px; }
        .wx-now { display: flex; align-items: center; }
        .wx-now .ic { width: 61px; height: 61px; margin-right: 20px; }
        .wx-now .temp { font-size: 65px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; margin-right: 22px; }
        .wx-now .meta { font-size: 20px; color: var(--ink-dim); line-height: 1.4; }
        .wx-now .meta b { color: var(--ink); font-weight: 600; }
        .hours { display: flex; justify-content: space-between; }
        .hr { display: flex; flex-direction: column; align-items: center; }
        .hr .hh { font-size: 18px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
        .hr .ic { width: 35px; height: 35px; margin: 8px 0; }
        .hr .tt { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .cond { display: flex; flex-wrap: wrap; }
        .cond div { width: 50%; font-size: 20px; color: var(--ink-dim); display: flex; flex-direction: column; margin-bottom: 8px; }
        .cond b { font-size: 28px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
        .ic { display: inline-block; }
        .ic svg { width: 100%; height: 100%; display: block; }

        /* --- Fileiras de baixo --- */
        .rows { padding: 11px 69px 54px; }
        .rail + .rail { margin-top: 32px; }
        .rail .lbl { margin-bottom: 14px; }
        .strip { display: flex; }
        .stile { flex: 0 0 auto; width: 202px; }
        .stile + .stile { margin-left: 21px; }
        .stile .box {
            height: 126px; border-radius: 21px; position: relative; overflow: hidden;
            background: var(--panel-2); border: 1px solid var(--panel-line-soft); color: var(--ink-dim);
            display: flex; align-items: center; justify-content: center;
            transition: transform .2s var(--ease);
        }
        .stile .box svg { width: 48px; height: 48px; }
        .stile .box img { max-width: 64%; max-height: 64%; }
        .stile .box img.lp { max-width: 100%; max-height: 100%; }
        .stile .cap { font-size: 18px; color: var(--ink-faint); text-align: center; margin-top: 10px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .2s ease; }
        .stile.on .box { background: rgba(255,255,255,.10); border-color: var(--focus); color: var(--ink);
            transform: translateY(-7px) scale(1.05);
            box-shadow: 0 0 0 4px var(--focus), 0 10px 24px rgba(0,0,0,.45); }
        .stile.on .cap { color: var(--ink); }

        /* --- Toast --- */
        .toast {
            position: absolute; z-index: 9; left: 50%; top: 52px; transform: translate(-50%, -20px);
            padding: 14px 30px; border-radius: 30px; font-size: 21px;
            background: rgba(20, 22, 30, .88); border: 1px solid var(--panel-line);
            opacity: 0; transition: opacity .25s ease, transform .25s var(--ease); pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* --- Modo relógio (OLED): preto, pouca luz, bloco que flutua devagar pela tela --- */
        .saver { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 8; background: #000;
            opacity: 0; visibility: hidden; transition: opacity 1.2s ease, visibility 0s linear 1.2s; }
        body.saving .saver { opacity: 1; visibility: visible; transition: opacity 1.2s ease; }
        .sv { position: absolute; left: 0; top: 0; width: 760px; color: #8d877c; transition: transform 40s linear; }
        .sv.jump { transition: none; }
        .sv-d { font-size: 21px; font-weight: 400; letter-spacing: .32em; text-transform: uppercase; }
        .sv-t { font-family: "Instrument Serif", Georgia, serif; font-size: 300px; line-height: .86; letter-spacing: -0.02em;
            color: #d4cdc1; font-variant-numeric: tabular-nums; margin: 20px 0 6px -8px; }
        .sv-colon { animation: sv-blink 2s ease-in-out infinite; }
        @keyframes sv-blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
        .sv-bar { position: relative; height: 2px; background: #1a1916; margin-bottom: 34px; overflow: hidden; }
        .sv-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #b0603f;
            transform-origin: left; animation: sv-sec 60s linear infinite; }
        @keyframes sv-sec { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        .sv-w { display: flex; align-items: center; font-size: 30px; font-weight: 300; color: #a8a297; }
        .sv-w .ic { width: 40px; height: 40px; margin-right: 16px; opacity: .8; }
        .sv-h { font-size: 22px; font-weight: 300; margin-top: 12px; font-variant-numeric: tabular-nums; }
        .sv-q { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 36px; line-height: 1.25;
            color: #a8a297; margin-top: 34px; }
        .sv-q:empty { display: none; }
        /* À noite tudo vira vermelho escuro de baixa luminância */
        body.night .sv, body.night .sv-t, body.night .sv-w, body.night .sv-q { color: #6a1c1c; }
        body.night .sv-bar { background: #140606; }
        body.night .sv-bar i { background: #4a1414; }
        body.night .sv-w .ic { opacity: .35; }

        /* --- Seletor de plano de fundo --- */
        .picker { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 7; background: rgba(0,0,0,.55);
            display: none; align-items: center; justify-content: center; }
        body.picking .picker { display: flex; }
        .pk { width: 640px; padding: 34px 30px 26px; border-radius: 34px; background: rgba(16,18,24,.94); border: 1px solid var(--panel-line); }
        .pk h2 { font-size: 30px; font-weight: 600; margin: 0 10px 20px; }
        .pk-i { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-radius: 18px; font-size: 24px; color: var(--ink-dim); }
        .pk-i small { font-size: 18px; color: var(--ink-faint); }
        .pk-i.on { background: #fff; color: #000; }
        .pk-i.on small { color: #444; }
        .pk-i .ck { font-weight: 700; }
    </style>
</head>

        // WMO weather_code -> [descrição, ícone]
        function wmo(code, isDay) {
            var night = isDay === false;

            if (code === 1 || code === 2) return [code === 1 ? 'Poucas nuvens' : 'Parcialmente nublado', night ? 'clear' : 'pcloud'];
            if (code === 3) return ['Nublado', 'cloud'];
            if (code === 45 || code === 48) return ['Neblina', 'fog'];
            if (code >= 51 && code <= 57) return ['Garoa', 'rain'];
            if (code >= 61 && code <= 67) return ['Chuva', 'rain'];
            if (code >= 71 && code <= 77) return ['Neve', 'cloud'];
            if (code >= 80 && code <= 82) return ['Pancadas de chuva', 'rain'];
            if (code >= 95) return ['Tempestade', 'storm'];
            return ['Tempo instável', 'cloud'];

        // --- Root (Homebrew Channel) e serviço fmtvd ---

            try {
                webOS.service.request('luna://org.webosbrew.hbchannel.service', {

                    parameters: { command: cmd },
                    onSuccess: function(r) { if (cb) cb(r.stdoutString || ''); },

            var d = '/var/lib/webosbrew/fmtv';
            rootExec(

                'if [ "$(md5sum < $S/fmtvd.sh)" != "$(md5sum < $D/fmtvd.sh 2>/dev/null)" ]; then ' +
                '  cp $S/fmtvd.sh $D/fmtvd.sh; [ -f /tmp/fmtvd.pid ] && kill -TERM -$(cat /tmp/fmtvd.pid) 2>/dev/null; rm -f /tmp/fmtvd.pid; fi; ' +
                'cp $S/init.d-fmtv /var/lib/webosbrew/init.d/fmtv; chmod 755 /var/lib/webosbrew/init.d/fmtv $D/fmtvd.sh; ' +
                'if ! { [ -f /tmp/fmtvd.pid ] && kill -0 $(cat /tmp/fmtvd.pid) 2>/dev/null; }; then setsid sh $D/fmtvd.sh > /dev/null 2>&1 < /dev/null & fi; ' +

        // --- Abrir apps ---
        var pending = false;
        function launch(appId, params, label) {
            if (pending) return; // ignora cliques repetidos do controle
            if (!window.webOS || !webOS.service || typeof webOS.service.request !== 'function') {
                showToast('Prévia: abriria ' + label);
                return;
            }
            pending = true;
            var timer = setTimeout(function() { done('Sem resposta ao abrir ' + label + '.'); }, 8000);
            function done(msg) { clearTimeout(timer); pending = false; if (msg) showToast(msg, 4000); }
            showToast('Abrindo ' + label + '…', 2500);
            try {
                webOS.service.request('luna://com.webos.applicationManager', {
                    method: 'launch',
                    parameters: params ? { id: appId, params: params } : { id: appId },
                    onSuccess: function(res) {
                        if (!(res && res.returnValue === false)) recordUse(appId);
                        done(res && res.returnValue === false ? 'Não deu pra abrir ' + label + '.' : null);
                    },
                    onFailure: function(err) {
                        var t = (err && err.errorText) || '';
                        done(/not (installed|found)|does not exist|unknown/i.test(t) ? label + ' não está instalado.' : 'Não deu pra abrir ' + label + '.');
                    }

        }

        function go(nr, nc) { r = nr; c = nc; cols[r] = nc; render(); }
        function render() {
            for (var ri = 0; ri < grid.length; ri++) {
                for (var ci = 0; ci < grid[ri].length; ci++) {
                    grid[ri][ci].classList.toggle('on', ri === r && ci === c);
                }
            }
            document.body.classList.toggle('in-dock', r === 0);
            if (r === 0) {
                $('appName').textContent = DOCK[c].name;
                $('appCat').textContent = c === learnedDockIndex() ? 'Seu mais aberto ' + PERIODOS[periodo()] + ' · ' + DOCK[c].cat : DOCK[c].cat;
                deck.style.transform = 'translateY(0)';
                return;
            }
            // Fileiras: leva o item focado pro terço inferior da tela
            var el = grid[r][c], center = el.offsetHeight / 2;
            for (var p = el; p && p !== deck; p = p.offsetParent) center += p.offsetTop;
            var T = Math.round(1080 * 0.62 - center);
            T = Math.min(0, Math.max(T, 1080 - deck.scrollHeight));
            deck.style.transform = 'translateY(' + T + 'px)';
        }
        function activate() {
            var el = grid[r][c], box = el.querySelector('.box') || el;
            if (box.animate) box.animate([{ opacity: 1 }, { opacity: .6 }, { opacity: 1 }], { duration: 220 });
            actions[r][c]();
        }

        // --- Proteção de burn-in: modo relógio após 3 min + pixel shift ---
        var IDLE_MS = (CFG.idleMinutes || 3) * 60 * 1000, idleTimer = null, saverMove = null;
        var MESES_LONGOS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
        function renderSaver() {
            var now = new Date();
            $('svH').textContent = pad2(now.getHours());
            $('svM').textContent = pad2(now.getMinutes());
            $('svDate').textContent = DIAS[now.getDay()] + '  ·  ' + now.getDate() + ' de ' + MESES_LONGOS[now.getMonth()];
            var d = lastWx;
            if (d && d.current && d.daily) {
                var w = wmo(d.current.weather_code, d.current.is_day === 1);
                $('svIcon').innerHTML = ICON[w[1]];
                $('svWx').textContent = Math.round(d.current.temperature_2m) + '°  ' + w[0] + '  ·  máx ' +
                    Math.round(d.daily.temperature_2m_max[0]) + '°  mín ' + Math.round(d.daily.temperature_2m_min[0]) + '°';
            }
            var hrs = $('hours').querySelectorAll('.hr'), parts = [];
            for (var i = 0; i < hrs.length && i < 4; i++) {
                parts.push(hrs[i].querySelector('.hh').textContent + ' ' + hrs[i].querySelector('.tt').textContent);
            }
            $('svHours').textContent = CITY.name + (parts.length ? '   ·   ' + parts.join('   ') : '');
        }
        function syncSecondsBar() {
            // A barra enche a cada minuto, alinhada ao relógio de verdade.
            var bar = $('svBar');
            bar.style.animation = 'none';
            void bar.offsetWidth;
            bar.style.animation = '';
            bar.style.animationDelay = -(new Date().getSeconds()) + 's';
        }
        function saverTarget() {
            var sv = $('sv');
            var x = 90 + Math.random() * (1920 - 180 - sv.offsetWidth);
            var y = 70 + Math.random() * (1080 - 140 - sv.offsetHeight);
            return 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
        }
        function moveSaver() {
            // Flutua devagar (40 s em linha reta) até um ponto novo: nenhum pixel fica parado.
            renderSaver();
            $('sv').style.transform = saverTarget();
        }
        var saverTick = null, allowLgSaver = null;
        function enterSaver() {
            var sv = $('sv');
            renderSaver();
            sv.className = 'sv jump';
            sv.style.transform = saverTarget();
            void sv.offsetWidth;
            sv.className = 'sv';
            document.body.classList.add('saving');
            closePicker();
            aerial.pause(); // preto de verdade no OLED e sem gastar rede
            syncSecondsBar();
            setTimeout(moveSaver, 50);
            saverMove = setInterval(moveSaver, 40 * 1000);
            saverTick = setInterval(function() { renderSaver(); syncSecondsBar(); }, 30 * 1000);
            // Depois de 2 h parado, deixa a TV seguir o próprio fluxo (protetor e tela apagada) pra descansar o OLED.
            allowLgSaver = setTimeout(function() { rootExec('touch /tmp/fmtv-allow-screensaver'); }, 2 * 60 * 60 * 1000);
        }
        function wake() {
            var wasSaving = document.body.classList.contains('saving');
            if (wasSaving) {
                document.body.classList.remove('saving');
                clearInterval(saverMove);
                clearInterval(saverTick);
                clearTimeout(allowLgSaver);
                rootExec('rm -f /tmp/fmtv-allow-screensaver');
                if (wallpaper !== 'preto') { var p = aerial.play(); if (p && p.catch) p.catch(function() {}); }
                focusLearned();
            }
            clearTimeout(idleTimer);
            idleTimer = setTimeout(enterSaver, IDLE_MS);
            return wasSaving;
        }
        var SHIFT = [[0, 0], [2, 1], [4, 0], [2, -2], [0, -4], [-2, -2], [-4, 0], [-2, 2]], shiftIdx = 0;
        function pixelShift() {
            var p = SHIFT[++shiftIdx % SHIFT.length];
            $('screen').style.transform = 'translate(' + p[0] + 'px,' + p[1] + 'px)';
        }

        document.addEventListener('keydown', function(e) {
            var k = e.keyCode;
            if (wake()) { e.preventDefault(); return; } // tecla no modo relógio só acorda
            if (document.body.classList.contains('picking')) {
                if (k === 40) pkIdx = Math.min(WALLPAPERS.length - 1, pkIdx + 1);
                else if (k === 38) pkIdx = Math.max(0, pkIdx - 1);
                else if (k === 13) { choosePicker(); e.preventDefault(); return; }
                else if (k === 461 || k === 8) closePicker();
                renderPicker();
                e.preventDefault();
                return;
            }
            var n = grid[r].length;
            if (k === 39) { if (c < n - 1) go(r, c + 1); }
            else if (k === 37) { if (c > 0) go(r, c - 1); }
            else if (k === 40) { if (r < grid.length - 1) go(r + 1, Math.min(cols[r + 1], grid[r + 1].length - 1)); }
            else if (k === 38) { if (r > 0) go(r - 1, Math.min(cols[r - 1], grid[r - 1].length - 1)); }
            else if (k === 13) activate();
            else if (k === 461 || k === 8) { if (r !== 0) go(0, cols[0]); } // Voltar: sobe pro dock
            else return;
            e.preventDefault();
        });
        document.addEventListener('mousemove', function() { wake(); });

        // Ao voltar pro launcher, atualiza hora/clima e acorda
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) { wake(); tick(); fetchWeather(); if (r === 0) focusLearned(); }
        });

        $('wxCity').textContent = 'Clima · ' + CITY.name;
        showQuote();
        tick();
        setInterval(tick, 10000);
        fetchWeather();
        setInterval(fetchWeather, 20 * 60 * 1000);
        setInterval(pixelShift, 60 * 1000);
        playAerial();
        discoverApps();
        if (CFG.rootDaemon) installDaemon();
        wake();
        render();
        focusLearned();
    </script>
</body>
</html>
