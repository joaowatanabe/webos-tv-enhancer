<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Free My TV</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <script src="webOSTV.js"></script>
    <script src="config.example.js"></script>
    <script src="config.js"></script>
    <style>
        /* Launcher estilo Apple TV — design aprovado em 2026-10-28.
           Tela fixa 1920x1080; o deck rola por dentro (home + 3 fileiras).
           webOS 6.5 = Chromium 79: nada de cqw, aspect-ratio ou gap em flexbox. */
        :root {
            --ink: #f5f7fc;
            --ink-dim: #cdd2de;
            --ink-faint: #a4aabb;
            --wx-tint: 74, 163, 255; /* cor do clima (RGB), trocada conforme a temperatura */
            --panel: rgba(255, 255, 255, 0.06);
            --panel-2: rgba(10, 12, 18, 0.30);
            --panel-line: rgba(255, 255, 255, 0.10);
            --panel-line-soft: rgba(255, 255, 255, 0.06);
            --focus: #ffffff;
            --focus-glow: rgba(255, 255, 255, 0.5);
            --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --ease: cubic-bezier(.2, .75, .2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }

        html, body {
            width: 1920px; height: 1080px; overflow: hidden;
            background: #000; color: var(--ink); font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        /* --- Fundo: aerial em vídeo, fallback preto OLED --- */
        .bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 0; background: #000; }
        .bg video {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover;
            opacity: 0; transition: opacity 1.6s ease;
        }
        .bg video.on { opacity: 1; }
        .bg::after {
            content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
            background:
                linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.45) 16%, transparent 32%, transparent 46%, rgba(0,0,0,.82) 100%),
                radial-gradient(120% 90% at 50% 38%, transparent 52%, rgba(0,0,0,.5) 100%);
            transition: opacity 1.2s ease;
        }
        .bg .dim { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; opacity: 0; transition: opacity 1.2s ease; }
        body.night .bg .dim { opacity: .3; }
        /* Ao descer do dock o fundo escurece (como no tvOS): o vídeo vira ambiente e o texto ganha contraste */
        .bg .scrim { position: absolute; left: 0; top: 0; right: 0; bottom: 0; opacity: 0; transition: opacity .6s ease;
            background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.62) 45%, rgba(0,0,0,.82) 100%); }
        body:not(.in-dock) .bg .scrim { opacity: 1; }

        /* --- Tela / deck rolável --- */
        .screen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 2; overflow: hidden; transition: opacity .9s ease; }
        /* Só transform/opacity animam liso no Chromium 79 da TV; o deck fica numa camada da GPU. */
        .deck { position: relative; transition: transform .42s cubic-bezier(.22, .8, .24, 1); will-change: transform; }


        .home { height: 1080px; display: flex; flex-direction: column; padding: 61px 69px 58px; }
        /* Sombra no texto do topo: legível mesmo com aerial claro (céu, neve) */
        .top { display: flex; align-items: flex-start; justify-content: space-between;
            text-shadow: 0 2px 4px rgba(0,0,0,.6), 0 0 22px rgba(0,0,0,.45); }
        .greet { font-size: 38px; font-weight: 600; letter-spacing: -0.015em; }
        .greet small { display: block; max-width: 1100px; font-size: 24px; font-weight: 500; line-height: 1.3;
            color: rgba(245,247,252,.9); margin-top: 6px; }
        .clock { text-align: right; line-height: 1.15; font-variant-numeric: tabular-nums; }
        .clock .t { display: block; font-size: 54px; font-weight: 700; letter-spacing: -0.02em; }
        .clock .d { font-size: 22px; font-weight: 500; color: rgba(245,247,252,.9); }

        /* --- Assistente de voz: balão ✦ no lugar da frase do dia --- */
        .ai { display: none; align-items: flex-start; max-width: 1150px; margin-top: 14px; padding: 16px 28px 16px 18px;
            border-radius: 26px; background: rgba(14,16,26,.82); border: 1px solid rgba(155,140,255,.5);
            box-shadow: 0 0 36px rgba(120,100,255,.28); font-size: 27px; font-weight: 500; line-height: 1.35; text-shadow: none; }
        body.ai-on .ai { display: flex; animation: ai-in .35s var(--ease); }
        body.ai-on #quote { display: none; }
        .ai-ic { flex: 0 0 36px; height: 36px; margin: 1px 14px 0 0; }
        .ai-ic svg { width: 100%; height: 100%; display: block; }
        body.ai-busy .ai-ic { animation: ai-pulse 1.1s ease-in-out infinite; }
        body.ai-busy .ai-t { color: var(--ink-dim); }
        @keyframes ai-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.8); opacity: .5; } }
        @keyframes ai-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

        .lower { margin-top: auto; display: flex; flex-direction: column; }
        .lower > * + * { margin-top: 24px; }
        .hero .cat { font-size: 22px; font-weight: 500; color: var(--ink-dim); margin-bottom: 6px; letter-spacing: .01em; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
        .hero .name { font-size: 90px; font-weight: 700; letter-spacing: -0.03em; line-height: .96; }

        /* --- Dock (só streaming) --- */
        .dock {
            display: flex; padding: 16px 27px;
            background: var(--panel); border: 1px solid var(--panel-line); border-radius: 38px;
        }
        .tile {
            position: relative; flex: 1 1 0; height: 142px; border-radius: 23px;
            display: flex; align-items: center; justify-content: center;
            transition: transform .28s var(--ease);
            will-change: transform;
        }
        .tile::after { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: inherit;
            background: #000; opacity: 0; transition: opacity .28s ease; pointer-events: none; }
        .tile + .tile { margin-left: 23px; }
        .tile img { display: block; max-width: 56%; max-height: 46%; }
        .tile img.wide { max-width: 70%; max-height: 40%; }
        .tile .wd { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
        .tile .label {
            position: absolute; left: 0; right: 0; bottom: -28px; text-align: center;
            font-size: 18px; color: var(--ink-dim); opacity: 0; transition: opacity .2s ease;
        }
        .tile.on { transform: translateY(-11px) scale(1.07); z-index: 3;
            box-shadow: 0 0 0 5px var(--focus), 0 12px 28px rgba(0,0,0,.5); }
        .tile.on .label { opacity: 1; }
        body.in-dock .tile:not(.on)::after { opacity: .45; }

        /* --- Widgets de clima --- */
        .lower > .shelf { margin-top: 40px; }
        .shelf { display: flex; }
        .card {
            flex: 1 1 0; min-width: 0; padding: 16px 29px 20px; position: relative;
            background: rgba(10, 12, 18, .5); border: 1px solid var(--panel-line-soft); border-radius: 27px;
            text-shadow: 0 1px 3px rgba(0,0,0,.6);
            transition: transform .5s var(--ease); will-change: transform;
        }
        .card > * { position: relative; }
        /* Camada de cor do clima: só a opacidade anima (barato na GPU da TV) */
        .card::before { content: ""; position: absolute; left: -1px; top: -1px; right: -1px; bottom: -1px; border-radius: inherit;
            background: linear-gradient(160deg, rgba(var(--wx-tint), .32) 0%, rgba(12, 14, 22, .85) 60%);
            border: 1px solid rgba(var(--wx-tint), .55); box-shadow: 0 0 34px rgba(var(--wx-tint), .22);
            opacity: 0; transition: opacity .5s ease; }
        /* Ao descer: cards sobem um pouco e ganham a cor do clima, um de cada vez */
        body:not(.in-dock) .card { transform: translateY(-6px); }
        body:not(.in-dock) .card::before { opacity: 1; }
        body:not(.in-dock) .card + .card::before { transition-delay: .07s; }
        body:not(.in-dock) .card + .card + .card::before { transition-delay: .14s; }
        body:not(.in-dock) .card + .card { transition-delay: .07s; }
        body:not(.in-dock) .card + .card + .card { transition-delay: .14s; }
        body:not(.in-dock) .card .lbl { color: rgb(var(--wx-tint)); }
        .card + .card { margin-left: 27px; }
        .lbl { font-size: 19px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 12px;
            text-shadow: 0 1px 3px rgba(0,0,0,.7); transition: color .5s ease; }
        .wx-now { display: flex; align-items: center; }
        .wx-now .ic { width: 61px; height: 61px; margin-right: 20px; }
        .wx-now .temp { font-size: 65px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; margin-right: 22px; }
        .wx-now .meta { font-size: 20px; color: var(--ink-dim); line-height: 1.4; }
        .wx-now .meta b { color: var(--ink); font-weight: 600; }
        .hours { display: flex; justify-content: space-between; }
        .hr { display: flex; flex-direction: column; align-items: center; }
        .hr .hh { font-size: 18px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
        .hr .ic { width: 35px; height: 35px; margin: 8px 0; }
        .hr .tt { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .cond { display: flex; flex-wrap: wrap; }
        .cond div { width: 50%; font-size: 20px; color: var(--ink-dim); display: flex; flex-direction: column; margin-bottom: 8px; }
        .cond b { font-size: 28px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
        .ic { display: inline-block; }
        .ic svg { width: 100%; height: 100%; display: block; }

        /* --- Fileiras de baixo --- */
        .rows { padding: 11px 69px 54px; }
        .rail + .rail { margin-top: 32px; }
        .rail .lbl { margin-bottom: 14px; color: rgba(245,247,252,.85); }
        .strip { display: flex; }
        .stile { flex: 0 0 auto; width: 202px; }
        .stile + .stile { margin-left: 21px; }
        .stile .box {
            height: 126px; border-radius: 21px; position: relative; overflow: hidden;
            background: rgba(10, 12, 18, .55); border: 1px solid var(--panel-line); color: var(--ink-dim);
            display: flex; align-items: center; justify-content: center;
            transition: transform .2s var(--ease);
        }
        .stile .box svg { width: 48px; height: 48px; }
        .stile .box img { max-width: 64%; max-height: 64%; }
        .stile .box img.lp { max-width: 100%; max-height: 100%; }
        .stile .cap { font-size: 19px; font-weight: 500; color: var(--ink-dim); text-align: center; margin-top: 10px; text-shadow: 0 1px 3px rgba(0,0,0,.7);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .2s ease; }
        .stile.on .box { background: rgba(255,255,255,.10); border-color: var(--focus); color: var(--ink);
            transform: translateY(-7px) scale(1.05);
            box-shadow: 0 0 0 4px var(--focus), 0 10px 24px rgba(0,0,0,.45); }
        .stile.on .cap { color: var(--ink); }

        /* --- Toast --- */
        .toast {
            position: absolute; z-index: 9; left: 50%; top: 52px; transform: translate(-50%, -20px);
            padding: 14px 30px; border-radius: 30px; font-size: 21px;
            background: rgba(20, 22, 30, .88); border: 1px solid var(--panel-line);
            opacity: 0; transition: opacity .25s ease, transform .25s var(--ease); pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* --- Seletor de plano de fundo --- */
        .picker { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 7; background: rgba(0,0,0,.55);
            display: none; align-items: center; justify-content: center; }
        body.picking .picker { display: flex; }
        .pk { width: 640px; padding: 34px 30px 26px; border-radius: 34px; background: rgba(16,18,24,.94); border: 1px solid var(--panel-line); }
        .pk h2 { font-size: 30px; font-weight: 600; margin: 0 10px 20px; }
        .pk-i { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-radius: 18px; font-size: 24px; color: var(--ink-dim); }
        .pk-i small { font-size: 18px; color: var(--ink-faint); }
        .pk-i.on { background: #fff; color: #000; }
        .pk-i.on small { color: #444; }
        .pk-i .ck { font-weight: 700; }
    </style>
</head>

    <div class="toast" id="toast"></div>

    <script>

        var CITY = CFG.city;

        var ICON = {

        // --- Abrir apps ---
        var pending = false;

                showToast('Prévia: abriria ' + label);
                return;
            }
            pending = true;
            var timer = setTimeout(function() { done('Sem resposta ao abrir ' + label + '.'); }, 8000);
            function done(msg) { clearTimeout(timer); pending = false; if (msg) showToast(msg, 4000); }
            showToast('Abrindo ' + label + '…', 2500);
            try {
                webOS.service.request('luna://com.webos.applicationManager', {
                    method: 'launch',
                    parameters: params ? { id: appId, params: params } : { id: appId },
                    onSuccess: function(res) {
                        if (!(res && res.returnValue === false)) recordUse(appId);
                        done(res && res.returnValue === false ? 'Não deu pra abrir ' + label + '.' : null);
                    },
                    onFailure: function(err) {
                        var t = (err && err.errorText) || '';
                        done(/not (installed|found)|does not exist|unknown/i.test(t) ? label + ' não está instalado.' : 'Não deu pra abrir ' + label + '.');

            if (k === 403 && r === OPEN_ROW && openIds[c]) { closeApps([openIds[c]]); e.preventDefault(); return; } // botão vermelho
            var n = grid[r].length;
            if (k === 39) { if (c < n - 1) go(r, c + 1); }
            else if (k === 37) { if (c > 0) go(r, c - 1); }
            else if (k === 40) { if (r < grid.length - 1) go(r + 1, Math.min(cols[r + 1], grid[r + 1].length - 1)); }
            else if (k === 38) { if (r > 0) go(r - 1, Math.min(cols[r - 1], grid[r - 1].length - 1)); }
            else if (k === 13) activate();
            else if (k === 461 || k === 8) { if (r !== 0) go(0, cols[0]); } // Voltar: sobe pro dock
            else return;
            e.preventDefault();
        });

        // Ao voltar pro launcher, atualiza hora/clima e acorda
        document.addEventListener('visibilitychange', function() {
            // Fora da frente, solta o vídeo de fundo: libera ~60 MB e ~9% de CPU pros outros apps (menos apps fechados por memória).
            if (document.hidden) { aerial.pause(); aerial.removeAttribute('src'); aerial.load(); return; }
            tick(); fetchWeather(); refreshOpenApps(); playAerial(); if (r === 0) focusLearned();
        });

        $('wxCity').textContent = 'Clima · ' + CITY.name;
        showQuote();
        tick();
        setInterval(tick, 10000);
        fetchWeather();
        setInterval(fetchWeather, 20 * 60 * 1000);
        setInterval(pixelShift, 60 * 1000);
        playAerial();
        discoverApps();
        loadMyPlaylists();
        refreshOpenApps();
        setInterval(loadMyPlaylists, 6 * 60 * 60 * 1000);
        if (CFG.rootDaemon) installDaemon();
        render();
        focusLearned();
    </script>
</body>
</html>
